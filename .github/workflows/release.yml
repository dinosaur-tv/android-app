name: Release APK

# Публикует подписанный APK пульта для телефона в GitHub Releases по тегу vX.Y.Z.
# Адрес сервера задаётся в самом приложении, поэтому здесь нужны только секреты подписи.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew

      - name: Unlock the release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "Add the ANDROID_KEYSTORE_BASE64 secret. An APK signed with another key cannot be updated in place."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          DINO_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          DINO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DINO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DINO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Name the file after the release
        run: |
          test -f app/build/outputs/apk/release/app-release.apk \
            || { echo "assembleRelease produced no signed APK; check the signing secrets"; exit 1; }
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/dino-home-${GITHUB_REF_NAME}.apk"
          ( cd out && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - uses: actions/upload-artifact@v4
        with:
          name: dino-home-apk
          path: out/*

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Dino Home $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
